<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{
    min-height:100vh;
    background:#f5f7fa;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.box{
    background:#fff;
    padding:48px 40px;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
    text-align:center;
    width:100%;
    max-width:420px;
}
h1{
    font-size:28px;
    color:#222;
    margin-bottom:8px;
}
.desc{
    color:#666;
    margin-bottom:36px;
}
.btn-wrap{
    display:flex;
    flex-direction:column;
    gap:24px;
}
.item{
    display:flex;
    flex-direction:column;
    gap:6px;
}
a.btn{
    display:block;
    text-decoration:none;
    padding:16px;
    border-radius:12px;
    font-size:16px;
    font-weight:500;
    transition:0.2s;
}
.btn-encrypt{
    background:#eef2ff;
    color:#3b5bdb;
    border:1px solid #c9d6ff;
}
.btn-game{
    background:#111;
    color:#fff;
}
.btn-donate{
    background:#fff1e6;
    color:#ea580c;
    border:1px solid #fdba74;
}
.btn-pan{
    background:#ecfdf5;
    color:#059669;
    border:1px solid #a7f3d0;
}
a.btn:hover{transform:translateY(-2px);}
.tip{
    font-size:13px;
    color:#888;
}
footer{
    margin-top:40px;
    color:#999;
    font-size:14px;
}
</style>
</head>
<body>
<div class="box">
    <h1>ixiaozhou</h1>
    <p class="desc">个人站点</p>
    <div class="btn-wrap">
        <div class="item">
            <a class="btn btn-encrypt" href="https://jiami.ixiaozhou.com">加密平台</a>
            <div class="tip">加密平台现在不稳定，没有客服接入</div>
        </div>
        <div class="item">
            <a class="btn btn-game" href="https://game.ixiaozhou.com">游戏圈</a>
        </div>
        <div class="item">
            <a class="btn btn-pan" href="https://ixiaozhou.tttttttttt.top">网盘</a>
        </div>
        <div class="item">
            <a class="btn btn-donate" href="https://afdian.com/a/ixiaozhou/plan">打赏支持</a>
        </div>
    </div>
</div>
<footer>© ixiaozhou.com</footer>
</body>
</html>
